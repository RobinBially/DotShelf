name: DotShelf macOS build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: '26.3'
      - name: Check localization catalog
        run: python3 scripts/check-localization.py
      - name: Run tests
        run: swift test
      - name: Build and verify native ad-hoc bundle
        run: ./build-app.sh .build/ci
      - name: Package bundle
        run: ditto -c -k --sequesterRsrc --keepParent .build/ci/DotShelf.app .build/DotShelf-ci.zip
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: DotShelf-ci
          path: .build/DotShelf-ci.zip
          if-no-files-found: error
