name: DotShelf macOS build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: maxim-lobanov/setup-xcode@1242409711ff5721add51979e9e11e23ebb7e5a4 # v1
        with:
          xcode-version: '26.3'
      - name: Check localization catalog
        run: python3 scripts/check-localization.py
      - name: Run tests
        run: swift test
      - name: Build and verify native ad-hoc bundle
        run: ./build-app.sh .build/ci
      - name: Package bundle
        run: ditto -c -k --sequesterRsrc --keepParent .build/ci/DotShelf.app .build/DotShelf-ci.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: DotShelf-ci
          path: .build/DotShelf-ci.zip
          if-no-files-found: error
